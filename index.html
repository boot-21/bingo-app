<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo 600 Telegram App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: white;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        h1 { color: #38ef7d; font-size: 22px; }
        .btn-mode {
            background-color: #0088cc;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            width: 80%;
            font-weight: bold;
        }
        .btn-admin { background-color: #27ae60; }
        .btn-action { background-color: #f39c12; margin-top: 10px; }
        .hidden { display: none; }
        .card-number {
            font-size: 28px;
            font-weight: bold;
            color: #f1c40f;
            margin: 15px 0;
        }
        .called-box {
            font-size: 40px;
            font-weight: bold;
            color: #e74c3c;
            background: #2c3e50;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            min-width: 100px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <h1>🎰 Bingo 600 Telegram App</h1>

    <!-- Mode Selection Screen -->
    <div id="modeSelection">
        <button class="btn-mode" onclick="showPlayerScreen()">👤 ተጫዋች (Player)</button><br>
        <button class="btn-mode btn-admin" onclick="showAdminScreen()">👑 አስተዳዳሪ (Admin Caller)</button>
    </div>

    <!-- Player Screen -->
    <div id="playerScreen" class="hidden">
        <h2>👤 የተጫዋች ገጽ</h2>
        <button class="btn-mode btn-action" onclick="autoSelectCard()">🎲 በራሱ ካርቴላ ይምረጡ (Auto Select)</button>
        <div id="selectedCardInfo" class="card-number">ምንም ካርቴላ አልተመረጠም</div>
        <button class="btn-mode" onclick="goBack()">⬅️ ተመለስ</button>
    </div>

    <!-- Admin Screen -->
    <div id="adminScreen" class="hidden">
        <h2>👑 የአስተዳዳሪ ገጽ</h2>
        <div class="called-box" id="currentNumber">--</div><br>
        <button class="btn-mode btn-admin" onclick="drawNextNumber()">▶️ ቀጣይ ቁጥር ጥራ</button><br>
        <button class="btn-mode btn-action" id="autoBtn" onclick="toggleAutoCall()">⚡ በራሱ እንዲጠራ አስጀምር (Auto Call)</button><br>
        <button class="btn-mode" onclick="resetGame()">🔄 ጨዋታውን አድስ (Reset)</button><br>
        <button class="btn-mode" onclick="goBack()">⬅️ ተመለስ</button>
    </div>

    <script>
        let tg = window.Telegram ? window.Telegram.WebApp : null;
        if(tg) tg.expand();

        let calledNumbers = [];
        let autoInterval = null;

        function showPlayerScreen() {
            document.getElementById('modeSelection').classList.add('hidden');
            document.getElementById('playerScreen').classList.remove('hidden');
        }

        function showAdminScreen() {
            document.getElementById('modeSelection').classList.add('hidden');
            document.getElementById('adminScreen').classList.remove('hidden');
        }

        function goBack() {
            stopAutoCall();
            document.getElementById('playerScreen').classList.add('hidden');
            document.getElementById('adminScreen').classList.add('hidden');
            document.getElementById('modeSelection').classList.remove('hidden');
        }

        // 1. በራሱ ካርቴላ ለመምረጥ (Auto-Select Card)
        function autoSelectCard() {
            const randomCardId = Math.floor(Math.random() * 600) + 1;
            document.getElementById('selectedCardInfo').innerText = "የተመረጠው ካርቴላ ቁጥር፦ #" + randomCardId;
        }

        // 2. ቁጥር መጥራት
        function drawNextNumber() {
            if (calledNumbers.length >= 75) {
                alert("ሁሉም ቁጥሮች ተጠርተው አልቀዋል!");
                stopAutoCall();
                return;
            }
            let nextNum;
            do {
                nextNum = Math.floor(Math.random() * 75) + 1;
            } while (calledNumbers.includes(nextNum));

            calledNumbers.push(nextNum);
            document.getElementById('currentNumber').innerText = nextNum;
        }

        // 3. በራሱ ቁጥር እንዲጠራ ማድረግ (Auto Call)
        function toggleAutoCall() {
            if (autoInterval) {
                stopAutoCall();
            } else {
                autoInterval = setInterval(drawNextNumber, 3000); // በየ 3 ሰከንዱ ይጥራል
                document.getElementById('autoBtn').innerText = "⏸️ በራሱ መጥራቱን አቁም";
                document.getElementById('autoBtn').style.backgroundColor = "#e74c3c";
            }
        }

        function stopAutoCall() {
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
                document.getElementById('autoBtn').innerText = "⚡ በራሱ እንዲጠራ አስጀምር (Auto Call)";
                document.getElementById('autoBtn').style.backgroundColor = "#f39c12";
            }
        }

        function resetGame() {
            stopAutoCall();
            calledNumbers = [];
            document.getElementById('currentNumber').innerText = "--";
            alert("ጨዋታው ታድሷል!");
        }
    </script>
</body>
</html>
